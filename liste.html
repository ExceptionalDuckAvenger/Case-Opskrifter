<!doctype html>
<html lang="da">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opskrifter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f5f7;
            color: #15171c;
            line-height: 1.5;
        }

        header {
            background: #fff;
            border-bottom: 1px solid #d9dce2;
            padding: 3rem 1.5rem 2rem;
        }

        header div,
        main {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            font-size: clamp(2.2rem, 6vw, 4rem);
            letter-spacing: -0.03em;
            line-height: 1;
        }

        header p {
            color: #6b7079;
            margin-top: 0.75rem;
        }

        main {
            padding: 2.5rem 1.5rem 4rem;
        }

        .recipe_list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 2rem 1.5rem;
        }

        .recipe img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            background: #e6e8ec;
            border-radius: 6px;
        }

        .recipe h3 {
            font-size: 1rem;
            margin-top: 0.75rem;
            line-height: 1.3;
        }

        .recipe p {
            font-size: 0.85rem;
            color: #6b7079;
        }

        .recipe .rating {
            color: #15171c;
            font-weight: bold;
            margin-top: 0.25rem;
        }

        .error {
            color: #d42f2f;
        }
    </style>
</head>

<body>
    <header>
        <div>
            <h1>Opskrifter</h1>
            <p>Billeder og info hentet fra dummyjson.com/recipes</p>
        </div>
    </header>

    <main>
        <div class="recipe_list">
            <p>Henter opskrifter…</p>
        </div>
    </main>

    <script>
        const url = "https://dummyjson.com/recipes";
        const list = document.querySelector(".recipe_list");

        fetch(url)
            .then((response) => response.json())
            .then((data) => showRecipes(data.recipes))
            .catch(() => {
                list.innerHTML = "<p class='error'>Kunne ikke hente opskrifter. Tjek din internetforbindelse.</p>";
            });

        function showRecipes(recipes) {
            list.innerHTML = "";

            recipes.forEach((recipe) => {
                list.innerHTML += `
          <article class="recipe">
            <img src="${recipe.image}" alt="${recipe.name}" />
            <h3>${recipe.name}</h3>
            <p>${recipe.cuisine} · ${recipe.difficulty} · ${recipe.prepTimeMinutes + recipe.cookTimeMinutes} min</p>
            <p class="rating">★ ${recipe.rating}</p>
          </article>`;
            });
        }
    </script>
</body>

</html>
